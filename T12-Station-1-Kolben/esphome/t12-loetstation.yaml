font:
  - file: "gfonts://Roboto"
    id: f16
    size: 16
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß", "–", "·", "−", "„", "“"]
  - file: "gfonts://Roboto"
    id: f20
    size: 20
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß", "–", "·", "−", "„", "“"]
  - file: "gfonts://Roboto"
    id: f24
    size: 24
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß", "–", "·", "−", "„", "“"]
  - file:
      type: gfonts
      family: Roboto Mono
      weight: 500
    id: d64
    size: 64
