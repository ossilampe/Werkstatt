# ---------------------------------------------------------------------
#  Oberfläche 480 x 320 (quer)
# ---------------------------------------------------------------------
lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touch
  rotation: 90
  buffer_size: 25%
  default_font: f20
  on_idle:
    timeout: 600s
    then:
      - light.turn_on: {id: display_backlight, brightness: 25%}
  theme:
    label:
      text_color: 0xFFFFFF
  style_definitions:
    - id: st_kachel
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 10
      border_width: 3
      border_color: 0x1F1F1F
      pad_all: 0
    - id: st_knopf
      bg_color: 0x3A3A3A
      bg_opa: COVER
      radius: 8
      border_width: 0
      shadow_width: 0
    - id: st_zeile
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 8
      border_width: 0
      pad_all: 0

  # über allen Seiten: Profilauswahl nach Spitzenwechsel und Hinweise
  top_layer:
    widgets:
      - obj:
          id: pop_layer
          x: 0
          y: 0
          width: 480
          height: 320
          radius: 0
          border_width: 0
          bg_color: 0x000000
          bg_opa: 70%
          hidden: true
          widgets:
            - obj:
                align: CENTER
                width: 400
                height: 290
                radius: 14
                bg_color: 0x262626
                border_width: 3
                border_color: 0xFF8C00
                scrollable: false
                widgets:
                  - label: {id: pop_titel, align: TOP_MID, y: 2, text: "", text_color: 0xFF8C00}
                  - roller:
                      id: pop_rol
                      align: TOP_MID
                      y: 36
                      width: 340
                      visible_row_count: 4
                      text_font: f24
                      options: ["-"]
                      bg_color: 0x1F1F1F
                      border_width: 0
                      selected:
                        bg_color: 0xFF8C00
                        text_color: 0x000000
                  - button:
                      styles: st_knopf
                      align: BOTTOM_LEFT
                      x: 6
                      y: -4
                      width: 150
                      height: 44
                      on_click:
                        - script.execute: popup_zu
                      widgets:
                        - label: {align: CENTER, text: "Abbrechen", text_font: f16}
                  - button:
                      styles: st_knopf
                      align: BOTTOM_RIGHT
                      x: -6
                      y: -4
                      width: 150
                      height: 44
                      bg_color: 0xFF8C00
                      on_click:
                        - script.execute: popup_ok
                      widgets:
                        - label: {align: CENTER, text: "Übernehmen", text_color: 0x000000}
      - obj:
          id: hin_box
          align: CENTER
          width: 400
          height: 130
          radius: 14
          bg_color: 0x262626
          border_width: 3
          border_color: 0xFFC107
          scrollable: false
          hidden: true
          on_click:
            - lambda: 't12::sichtbar(id(hin_box), false);'
          widgets:
            - label: {id: hin_text, align: CENTER, width: 370, long_mode: WRAP, text_align: CENTER, text: "", text_color: 0xFFC107}

  pages:
    # ================= Hauptseite =================
    - id: seite_haupt
      bg_color: 0x000000
      scrollable: false
      widgets:
        - label: {x: 10, y: 6, text: "T12 Lötstation", text_color: 0xFF8C00}
        - label: {id: t_kopf, align: TOP_RIGHT, x: -10, y: 9, text: "", text_font: f16, text_color: 0x8C8C8C}

        # ---- Kolben A ----
        - obj:
            id: kachel_a
            styles: st_kachel
            x: 8
            y: 36
            width: 228
            height: 228
            scrollable: false
            # ganze Kachel antippen = Kolben ein/aus (und auswählen)
            on_click:
              - script.execute: {id: ein_aus, i: 0}
            widgets:
              - label: {id: t_name_a, x: 14, y: 10, text: "Kolben A", text_color: 0x8C8C8C}
              - label: {id: t_ein_a, align: TOP_RIGHT, x: -14, y: 12, text: "AUS", text_font: f16, text_color: 0x8C8C8C}
              # Restzeit bis Standby (gelb) / Schlafen (blau), läuft am Außenrand nach unten
              - obj: {id: zeit_a, align: TOP_LEFT, x: 0, y: 0, width: 5, height: 222, radius: 2, border_width: 0, bg_color: 0xFFC107, bg_opa: COVER, clickable: false, hidden: true}
              - label: {id: t_ist_a, align: TOP_MID, y: 48, text: "---", text_font: d64}
              - label: {id: t_soll_a, align: TOP_MID, y: 124, text: "Soll --- °C", text_font: f24}
              - label: {id: t_stat_a, align: TOP_MID, y: 160, text: "", text_font: f16, text_color: 0x8C8C8C}
              - bar:
                  id: bar_a
                  x: 12
                  y: 196
                  width: 198
                  height: 14
                  min_value: 0
                  max_value: 100
                  value: 0
                  clickable: false
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0xFF8C00

        # ---- Kolben B ----
        - obj:
            id: kachel_b
            styles: st_kachel
            x: 244
            y: 36
            width: 228
            height: 228
            scrollable: false
            # ganze Kachel antippen = Kolben ein/aus (und auswählen)
            on_click:
              - script.execute: {id: ein_aus, i: 1}
            widgets:
              - label: {id: t_name_b, x: 14, y: 10, text: "Kolben B", text_color: 0x8C8C8C}
              - label: {id: t_ein_b, align: TOP_RIGHT, x: -14, y: 12, text: "AUS", text_font: f16, text_color: 0x8C8C8C}
              # Restzeit bis Standby (gelb) / Schlafen (blau), läuft am Außenrand nach unten
              - obj: {id: zeit_b, align: TOP_RIGHT, x: 0, y: 0, width: 5, height: 222, radius: 2, border_width: 0, bg_color: 0xFFC107, bg_opa: COVER, clickable: false, hidden: true}
              - label: {id: t_ist_b, align: TOP_MID, y: 48, text: "---", text_font: d64}
              - label: {id: t_soll_b, align: TOP_MID, y: 124, text: "Soll --- °C", text_font: f24}
              - label: {id: t_stat_b, align: TOP_MID, y: 160, text: "", text_font: f16, text_color: 0x8C8C8C}
              - bar:
                  id: bar_b
                  x: 12
                  y: 196
                  width: 198
                  height: 14
                  min_value: 0
                  max_value: 100
                  value: 0
                  clickable: false
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0xFF8C00

        # ---- Festwerte (für den gewählten Kolben) + Menü ----
        - button:
            styles: st_knopf
            x: 8
            y: 272
            width: 110
            height: 42
            on_click:
              - script.execute: {id: festwert_taste, n: 1}
            widgets:
              - label: {id: fw_l1, align: CENTER, text: "280 °C"}
        - button:
            styles: st_knopf
            x: 126
            y: 272
            width: 110
            height: 42
            on_click:
