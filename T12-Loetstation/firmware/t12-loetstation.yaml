# ===================================================================
#  T12 Loetstation - 2 Kolben gleichzeitig
#  Waveshare ESP32-S3-Touch-LCD-3.5 + EC11-Drehgeber + ADS1115 + MCP6V27
#
#  Leisten-Pins (Waveshare 3,5"):
#    GPIO38 (Pin 7)  Heizung Kolben A  -> BC337 -> IRF5305
#    GPIO39 (Pin 9)  Heizung Kolben B  -> BC337 -> IRF5305
#    GPIO40 (Pin 11) Drehgeber A
#    GPIO41 (Pin 13) Drehgeber B
#    GPIO42 (Pin 15) Drehgeber Taster
#    GPIO17 (Pin 16) Griff A Bewegungs-/Ablageschalter (gegen GND)
#    GPIO18 (Pin 18) Griff B Bewegungs-/Ablageschalter (gegen GND)
#    I2C GPIO8/GPIO7 ADS1115 (0x48) am vorhandenen Bus
#      A0 = OpAmp Kolben A, A1 = OpAmp Kolben B, A2 = MCP9700 Gehaeuse
#
#  Bedienung:
#    Drehen        Solltemperatur des gewaehlten Kolbens (5-Grad-Schritte)
#                  im Menue: Wert der gewaehlten Zeile
#    Kurz druecken Kolben A <-> B wechseln / im Menue naechste Zeile
#    Lang druecken Menue auf / zu
#    Touch         Kachel antippen = Kolben waehlen, EIN/AUS, Festwerte, Menue
# ===================================================================

substitutions:
  fw_version: "2026.11.13"

esphome:
  name: t12-loetstation
  friendly_name: "T12 Lötstation"
  includes:
    - t12/loet.h
  on_boot:
    priority: -100
    then:
      # Touch schneller abfragen (wie beim Heizungs-Display)
      - lambda: |-
          for (lv_indev_t *i = lv_indev_get_next(nullptr); i != nullptr; i = lv_indev_get_next(i)) {
            lv_timer_t *t = lv_indev_get_read_timer(i);
            if (t != nullptr) lv_timer_set_period(t, 10);
          }
          t12::bewegt_ms[0] = millis();
          t12::bewegt_ms[1] = millis();
      - script.execute: ui_update

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "T12-Loetstation-Fallback"
    password: !secret t12_ap_password

captive_portal:

# ---------- Hardware Display (identisch zum Heizungs-Display) ----------
i2c:
  - id: i2c_bus
    sda: GPIO8
    scl: GPIO7
    frequency: 400kHz   # Touch, Erweiterungs-Chip und ADS1115 teilen sich den Bus
    scan: true

pca9554:
  - id: p_c_a
    address: 0x20
    i2c_id: i2c_bus

spi:
  id: display_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1
  miso_pin: GPIO2

display:
  - platform: mipi_spi
    id: my_display
    model: st7796
    spi_id: display_spi
    cs_pin:
      pca9554: p_c_a
      number: 2
    dc_pin: GPIO3
    reset_pin:
      pca9554: p_c_a
      number: 1
    spi_mode: 1
    data_rate: 40MHz
    color_order: bgr
    invert_colors: true
    pixel_mode: 16bit
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    id: my_touch
    update_interval: 20ms
    i2c_id: i2c_bus
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - light.turn_on:
          id: display_backlight
          brightness: 100%

# ---------- Ausgaenge ----------
output:
  - platform: ledc
    pin: GPIO6
    id: backlight_pwm
    frequency: 2000 Hz

  # Heizungen: GPIO -> 1k -> BC337 (10k Basis-GND) -> Gate IRF5305.
  # Nach Reset/Absturz ist der Pin ein Eingang -> Heizung sicher aus.
  - platform: gpio
    id: heiz_a
    pin: GPIO38
  - platform: gpio
    id: heiz_b
    pin: GPIO39

light:
  - platform: monochromatic
    name: "Display Beleuchtung"
    id: display_backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0

# ---------- ADS1115 (Messung im Heizpausen-Fenster, nur per sample()) ----------
ads1115:
  - id: ads
    address: 0x48
    i2c_id: i2c_bus

sensor:
  - platform: ads1115
    ads1115_id: ads
    id: adc_a
    multiplexer: A0_GND
    gain: 4.096
    sample_rate: 860
    update_interval: never
    internal: true
  - platform: ads1115
    ads1115_id: ads
    id: adc_b
    multiplexer: A1_GND
    gain: 4.096
    sample_rate: 860
    update_interval: never
    internal: true
  - platform: ads1115
    ads1115_id: ads
    id: adc_kalt
    multiplexer: A2_GND
    gain: 4.096
    sample_rate: 860
    update_interval: never
    internal: true

  # Drehgeber ALPS STEC12E08 (gemeinsamer Anschluss an GND).
  # Falls die Richtung falsch ist: pin_a und pin_b tauschen.
  - platform: rotary_encoder
    id: drehgeber
    internal: true
    resolution: 1
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    on_clockwise:
      - script.execute:
          id: drehen
          r: 1
    on_anticlockwise:
      - script.execute:
          id: drehen
          r: -1

  # --- Werte fuer Home Assistant (werden 1x pro Sekunde gesetzt) ---
  - platform: template
    id: ha_temp_a
    name: "Kolben A Temperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ha_temp_b
    name: "Kolben B Temperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ha_leist_a
    name: "Kolben A Leistung"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ha_leist_b
    name: "Kolben B Leistung"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ha_kalt
    name: "Gehäuse Temperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

text_sensor:
  - platform: template
    id: ha_stat_a
    name: "Kolben A Status"
    update_interval: never
  - platform: template
    id: ha_stat_b
    name: "Kolben B Status"
    update_interval: never
  - platform: template
    name: "Firmware"
    lambda: 'return {"${fw_version}"};'
    update_interval: never
    entity_category: diagnostic

binary_sensor:
  # Drehgeber-Taster
  - platform: gpio
    id: dg_taster
    internal: true
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      - min_length: 30ms
        max_length: 600ms
        then:
          - script.execute: kurz_druck
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: lang_druck

  # Griff-Schalter: jede Aenderung = Kolben wird benutzt.
  # Funktioniert mit Vibrations-/Neigungsschalter im Griff UND mit Ablagekontakt im Staender
  # (liegt der Kolben dauerhaft, kommen keine Flanken mehr -> Standby, spaeter Schlafen).
  - platform: gpio
    id: griff_a
    internal: true
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    on_state:
      - lambda: 't12::bewegt_ms[0] = millis();'
  - platform: gpio
    id: griff_b
    internal: true
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    on_state:
      - lambda: 't12::bewegt_ms[1] = millis();'

# ---------- Ein/Aus und Einstellungen (in HA sichtbar, im Flash gespeichert) ----------
switch:
  - platform: template
    id: kolben_a
    name: "Kolben A"
    icon: mdi:soldering-iron
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 't12::einschalten(0, millis());'
      - script.execute: ui_update
    on_turn_off:
      - script.execute: ui_update
  - platform: template
    id: kolben_b
    name: "Kolben B"
    icon: mdi:soldering-iron
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 't12::einschalten(1, millis());'
      - script.execute: ui_update
    on_turn_off:
      - script.execute: ui_update

number:
  - platform: template
    id: soll_a
    name: "Kolben A Solltemperatur"
    unit_of_measurement: "°C"
    min_value: 150
    max_value: 450
    step: 5
    initial_value: 330
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    id: soll_b
    name: "Kolben B Solltemperatur"
    unit_of_measurement: "°C"
    min_value: 150
    max_value: 450
    step: 5
    initial_value: 330
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    id: n_standby_t
    name: "Standby Temperatur"
    unit_of_measurement: "°C"
    min_value: 150
    max_value: 300
    step: 10
    initial_value: 200
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
  - platform: template
    id: n_standby_min
    name: "Standby nach"
    unit_of_measurement: "min"
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 3
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
  - platform: template
    id: n_schlaf_min
    name: "Schlafen nach"
    unit_of_measurement: "min"
    min_value: 0
    max_value: 120
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
  - platform: template
    id: kal_off_a
    name: "Kolben A Kalibrierung Offset"
    unit_of_measurement: "°C"
    min_value: -50
    max_value: 50
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
  - platform: template
    id: kal_fak_a
    name: "Kolben A Kalibrierung Faktor"
    unit_of_measurement: "%"
    min_value: 60
    max_value: 140
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
  - platform: template
    id: kal_off_b
    name: "Kolben B Kalibrierung Offset"
    unit_of_measurement: "°C"
    min_value: -50
    max_value: 50
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
  - platform: template
    id: kal_fak_b
    name: "Kolben B Kalibrierung Faktor"
    unit_of_measurement: "%"
    min_value: 60
    max_value: 140
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

globals:
  - id: auswahl        # 0 = Kolben A, 1 = Kolben B (Drehgeber/Festwerte wirken darauf)
    type: int
    initial_value: '0'
  - id: menue_offen
    type: bool
    initial_value: 'false'
  - id: menue_zeile    # 0..6, siehe menue_aendern
    type: int
    initial_value: '0'

# ---------- Regelung: alle 100 ms ----------
interval:
  - interval: 100ms
    then:
      - lambda: |-
          // 1) Beide Heizungen aus -> Messfenster
          id(aus_a).stop();
          id(aus_b).stop();
          id(heiz_a).turn_off();
          id(heiz_b).turn_off();
          delayMicroseconds(3000);           // MOSFET aus (~0,2 ms), RC 47k/1nF (47 us) + OpAmp eingeschwungen
          float va = id(adc_a).sample();     // je ca. 2 ms (860 SPS, Einzelmessung)
          float vb = id(adc_b).sample();

          static uint8_t n = 0;
          n++;
          if (n % 20 == 0) {                 // Kaltstelle alle 2 s
            float vc = id(adc_kalt).sample();
            if (!std::isnan(vc) && vc > 0.1f && vc < 1.75f) t12::t_kalt = (vc - 0.5f) / 0.01f;  // MCP9700
          }

          // 2) Regeln
          uint32_t jetzt = millis();
          float st = id(n_standby_t).state, sm = id(n_standby_min).state, sl = id(n_schlaf_min).state;
          float d0 = t12::schritt(0, id(kolben_a).state, va, id(soll_a).state,
                                  id(kal_off_a).state, id(kal_fak_a).state, st, sm, sl, jetzt);
          float d1 = t12::schritt(1, id(kolben_b).state, vb, id(soll_b).state,
                                  id(kal_off_b).state, id(kal_fak_b).state, st, sm, sl, jetzt);

          // 3) Heizen fuer den Rest des Zyklus
          if (d0 > 0.0f) {
            t12::ein_ms[0] = (uint32_t) (d0 * t12::ZYKLUS_MS);
            id(heiz_a).turn_on();
            id(aus_a).execute();
          }
          if (d1 > 0.0f) {
            t12::ein_ms[1] = (uint32_t) (d1 * t12::ZYKLUS_MS);
            id(heiz_b).turn_on();
            id(aus_b).execute();
          }

          // 4) Anzeige 3x/s, Home Assistant 1x/s
          if (n % 3 == 0) id(ui_update).execute();
          if (n % 10 == 0) id(ha_update).execute();

script:
  # Heizung nach der berechneten Zeit wieder aus (der Regel-Intervall schaltet sowieso vor jeder Messung ab)
  - id: aus_a
    mode: restart
    then:
      - delay: !lambda 'return t12::ein_ms[0];'
      - output.turn_off: heiz_a
  - id: aus_b
    mode: restart
    then:
      - delay: !lambda 'return t12::ein_ms[1];'
      - output.turn_off: heiz_b

  - id: ha_update
    then:
      - lambda: |-
          id(ha_temp_a).publish_state(t12::K[0].temp);
          id(ha_temp_b).publish_state(t12::K[1].temp);
          id(ha_leist_a).publish_state(t12::K[0].duty * 100.0f);
          id(ha_leist_b).publish_state(t12::K[1].duty * 100.0f);
          id(ha_kalt).publish_state(t12::t_kalt);
          std::string sa = t12::text(t12::K[0].zustand);
          std::string sb = t12::text(t12::K[1].zustand);
          if (id(ha_stat_a).state != sa) id(ha_stat_a).publish_state(sa);
          if (id(ha_stat_b).state != sb) id(ha_stat_b).publish_state(sb);

  # Drehgeber: r = +1 / -1
  - id: drehen
    parameters:
      r: int
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: |-
          lv_disp_trig_activity(NULL);
          if (id(menue_offen)) {
            id(menue_aendern).execute(id(menue_zeile), r);
            return;
          }
          int i = id(auswahl);
          auto *n = (i == 0) ? id(soll_a) : id(soll_b);
          float v = n->state + 5.0f * r;
          if (v < 150.0f) v = 150.0f;
          if (v > 450.0f) v = 450.0f;
          auto c = n->make_call();
          c.set_value(v);
          c.perform();
          t12::bewegt_ms[i] = millis();      // Bedienen weckt den Kolben aus Standby/Schlaf
          id(ui_update).execute();

  - id: kurz_druck
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: |-
          lv_disp_trig_activity(NULL);
          if (id(menue_offen)) id(menue_zeile) = (id(menue_zeile) + 1) % 7;
          else id(auswahl) = 1 - id(auswahl);
          id(ui_update).execute();

  - id: lang_druck
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - if:
          condition:
            lambda: 'return id(menue_offen);'
          then:
            - script.execute: menue_zu
          else:
            - lambda: 'id(menue_offen) = true;'
            - lvgl.page.show: seite_menue
            - script.execute: ui_update

  - id: menue_zu
    then:
      - lambda: 'id(menue_offen) = false;'
      - lvgl.page.show: seite_haupt
      - script.execute: ui_update

  # Festwert auf den gewaehlten Kolben
  - id: festwert
    parameters:
      wert: int
    then:
      - lambda: |-
          int i = id(auswahl);
          auto *n = (i == 0) ? id(soll_a) : id(soll_b);
          auto c = n->make_call();
          c.set_value((float) wert);
          c.perform();
          t12::bewegt_ms[i] = millis();
          id(ui_update).execute();

  # Menue-Zeile um r Schritte aendern (Schrittweite/Grenzen kommen aus der jeweiligen number)
  - id: menue_aendern
    mode: queued
    parameters:
      zeile: int
      r: int
    then:
      - lambda: |-
          number::Number *nums[7] = {id(n_standby_t), id(n_standby_min), id(n_schlaf_min),
                                     id(kal_off_a), id(kal_fak_a), id(kal_off_b), id(kal_fak_b)};
          if (zeile < 0 || zeile > 6) return;
          id(menue_zeile) = zeile;
          auto *x = nums[zeile];
          float v = x->state + r * x->traits.get_step();
          if (v < x->traits.get_min_value()) v = x->traits.get_min_value();
          if (v > x->traits.get_max_value()) v = x->traits.get_max_value();
          auto c = x->make_call();
          c.set_value(v);
          c.perform();
          id(ui_update).execute();

  # Alle Anzeigen auffrischen
  - id: ui_update
    then:
      - lambda: |-
          char b[40];
          lv_obj_t *ist[2]  = {t_ist_a, t_ist_b};
          lv_obj_t *soll[2] = {t_soll_a, t_soll_b};
          lv_obj_t *stat[2] = {t_stat_a, t_stat_b};
          lv_obj_t *bar[2]  = {bar_a, bar_b};
          lv_obj_t *kach[2] = {kachel_a, kachel_b};
          lv_obj_t *kn[2]   = {kn_a, kn_b};
          lv_obj_t *knt[2]  = {kn_a_t, kn_b_t};
          float sw[2] = {id(soll_a).state, id(soll_b).state};
          bool ein[2] = {id(kolben_a).state, id(kolben_b).state};

          for (int i = 0; i < 2; i++) {
            const t12::Kanal &k = t12::K[i];
            if (std::isnan(k.temp)) lv_label_set_text(ist[i], "---");
            else {
              snprintf(b, sizeof(b), "%.0f°", k.temp);
              lv_label_set_text(ist[i], b);
            }
            lv_obj_set_style_text_color(ist[i], lv_color_hex(ein[i] ? 0xFFFFFF : 0x8C8C8C), 0);
            snprintf(b, sizeof(b), "Soll %.0f °C", sw[i]);
            lv_label_set_text(soll[i], b);
            lv_label_set_text(stat[i], t12::text(k.zustand));
            lv_obj_set_style_text_color(stat[i], lv_color_hex(t12::farbe(k.zustand)), 0);
            lv_bar_set_value(bar[i], (int32_t) (k.duty * 100.0f + 0.5f), LV_ANIM_OFF);
            lv_obj_set_style_border_color(kach[i], lv_color_hex(id(auswahl) == i ? 0xFF8C00 : 0x1F1F1F), 0);
            lv_label_set_text(knt[i], ein[i] ? "EIN" : "AUS");
            lv_obj_set_style_bg_color(kn[i], lv_color_hex(ein[i] ? 0x2E7D32 : 0x3A3A3A), 0);
          }
          snprintf(b, sizeof(b), "Gehäuse %.0f °C", t12::t_kalt);
          lv_label_set_text(t_gehaeuse, b);

          if (id(menue_offen)) {
            number::Number *nums[7] = {id(n_standby_t), id(n_standby_min), id(n_schlaf_min),
                                       id(kal_off_a), id(kal_fak_a), id(kal_off_b), id(kal_fak_b)};
            lv_obj_t *wert[7]  = {v_0, v_1, v_2, v_3, v_4, v_5, v_6};
            lv_obj_t *zeile[7] = {z_0, z_1, z_2, z_3, z_4, z_5, z_6};
            const char *fmt[7] = {"%.0f °C", "%.0f min", "%.0f min", "%+.0f °C", "%.0f %%", "%+.0f °C", "%.0f %%"};
            for (int r = 0; r < 7; r++) {
              float v = nums[r]->state;
              if ((r == 1 || r == 2) && v == 0.0f) lv_label_set_text(wert[r], "aus");
              else {
                snprintf(b, sizeof(b), fmt[r], v);
                lv_label_set_text(wert[r], b);
              }
              bool akt = (r == id(menue_zeile));
              lv_obj_set_style_bg_color(zeile[r], lv_color_hex(akt ? 0x3A2A10 : 0x1F1F1F), 0);
              lv_obj_set_style_border_color(zeile[r], lv_color_hex(akt ? 0xFF8C00 : 0x1F1F1F), 0);
            }
          }

# ---------- Oberflaeche ----------
font:
  - file: "gfonts://Roboto"
    id: f14
    size: 14
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß"]
  - file: "gfonts://Roboto"
    id: f18
    size: 18
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß"]
  - file: "gfonts://Roboto"
    id: f20
    size: 20
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß"]
  - file: "gfonts://Roboto@500"
    id: f26
    size: 26
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Ä", "Ö", "Ü", "ä", "ö", "ü", "ß"]
  - file: "gfonts://Roboto@500"
    id: f64
    size: 64
    glyphs: " 0123456789-°"

lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touch
  rotation: 90          # quer: 480 x 320
  buffer_size: 25%

  # 10 min ohne Touch/Drehgeber: Beleuchtung dimmen (Anzeige laeuft weiter)
  on_idle:
    timeout: 600s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 25%

  theme:
    dark_mode: true
    label:
      text_color: 0xFFFFFF
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
  text_color: 0xFFFFFF
  text_font: f20

  style_definitions:
    - id: st_kachel
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 10
      border_width: 3
      border_color: 0x1F1F1F
      pad_all: 0
    - id: st_knopf
      bg_color: 0x3A3A3A
      bg_opa: COVER
      radius: 8
      border_width: 0
      shadow_width: 0
    - id: st_zeile
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 8
      border_width: 2
      border_color: 0x1F1F1F
      pad_all: 0

  pages:
    # ================= Hauptseite =================
    - id: seite_haupt
      bg_color: 0x000000
      scrollable: false
      widgets:
        - label:
            x: 10
            y: 6
            text: "T12 Lötstation"
            text_font: f20
            text_color: 0xFF8C00
        - label:
            id: t_gehaeuse
            align: TOP_RIGHT
            x: -10
            y: 9
            text: "Gehäuse -- °C"
            text_font: f14
            text_color: 0x8C8C8C

        # ---- Kolben A ----
        - obj:
            id: kachel_a
            styles: st_kachel
            x: 8
            y: 36
            width: 228
            height: 228
            scrollable: false
            on_click:
              - lambda: 'id(auswahl) = 0; id(ui_update).execute();'
            widgets:
              - label:
                  x: 12
                  y: 10
                  text: "Kolben A"
                  text_font: f20
                  text_color: 0x8C8C8C
              - button:
                  id: kn_a
                  styles: st_knopf
                  align: TOP_RIGHT
                  x: -8
                  y: 6
                  width: 72
                  height: 34
                  on_click:
                    - switch.toggle: kolben_a
                  widgets:
                    - label:
                        id: kn_a_t
                        align: CENTER
                        text: "AUS"
                        text_font: f18
              - label:
                  id: t_ist_a
                  align: TOP_MID
                  y: 48
                  text: "---"
                  text_font: f64
              - label:
                  id: t_soll_a
                  align: TOP_MID
                  y: 122
                  text: "Soll --- °C"
                  text_font: f26
              - label:
                  id: t_stat_a
                  align: TOP_MID
                  y: 160
                  text: "AUS"
                  text_font: f18
                  text_color: 0x8C8C8C
              - bar:
                  id: bar_a
                  x: 12
                  y: 196
                  width: 198
                  height: 14
                  min_value: 0
                  max_value: 100
                  value: 0
                  clickable: false
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0xFF8C00

        # ---- Kolben B ----
        - obj:
            id: kachel_b
            styles: st_kachel
            x: 244
            y: 36
            width: 228
            height: 228
            scrollable: false
            on_click:
              - lambda: 'id(auswahl) = 1; id(ui_update).execute();'
            widgets:
              - label:
                  x: 12
                  y: 10
                  text: "Kolben B"
                  text_font: f20
                  text_color: 0x8C8C8C
              - button:
                  id: kn_b
                  styles: st_knopf
                  align: TOP_RIGHT
                  x: -8
                  y: 6
                  width: 72
                  height: 34
                  on_click:
                    - switch.toggle: kolben_b
                  widgets:
                    - label:
                        id: kn_b_t
                        align: CENTER
                        text: "AUS"
                        text_font: f18
              - label:
                  id: t_ist_b
                  align: TOP_MID
                  y: 48
                  text: "---"
                  text_font: f64
              - label:
                  id: t_soll_b
                  align: TOP_MID
                  y: 122
                  text: "Soll --- °C"
                  text_font: f26
              - label:
                  id: t_stat_b
                  align: TOP_MID
                  y: 160
                  text: "AUS"
                  text_font: f18
                  text_color: 0x8C8C8C
              - bar:
                  id: bar_b
                  x: 12
                  y: 196
                  width: 198
                  height: 14
                  min_value: 0
                  max_value: 100
                  value: 0
                  clickable: false
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0xFF8C00

        # ---- Festwerte (fuer den gewaehlten Kolben) + Menue ----
        - button:
            styles: st_knopf
            x: 8
            y: 272
            width: 110
            height: 42
            on_click:
              - script.execute:
                  id: festwert
                  wert: 280
            widgets:
              - label:
                  align: CENTER
                  text: "280 °C"
        - button:
            styles: st_knopf
            x: 126
            y: 272
            width: 110
            height: 42
            on_click:
              - script.execute:
                  id: festwert
                  wert: 330
            widgets:
              - label:
                  align: CENTER
                  text: "330 °C"
        - button:
            styles: st_knopf
            x: 244
            y: 272
            width: 110
            height: 42
            on_click:
              - script.execute:
                  id: festwert
                  wert: 380
            widgets:
              - label:
                  align: CENTER
                  text: "380 °C"
        - button:
            styles: st_knopf
            x: 362
            y: 272
            width: 110
            height: 42
            on_click:
              - script.execute: lang_druck
            widgets:
              - label:
                  align: CENTER
                  text: "Menü"
                  text_color: 0xFF8C00

    # ================= Einstellungen =================
    # Zeile antippen = auswaehlen, dann Drehgeber oder -/+ benutzen
