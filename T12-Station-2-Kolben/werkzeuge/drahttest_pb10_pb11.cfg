# Prueft die Draehte OLED-Pad SCL/SDA -> PB10/PB11 (KSGER v2, STM32F103C8)
# PB12 (Pad SDA) und PB13 (Pad SCL) werden als Ausgang getrieben,
# PB10/PB11 als Eingang mit Pull-down zurueckgelesen. Danach Reset.
init
halt
# GPIOB-Takt an
mww 0x40021018 [expr {[mrw 0x40021018] | 0x8}]
set crh [mrw 0x40010C04]
# PB10, PB11: Eingang mit Pull/Down (0x8)   PB12, PB13: Ausgang push-pull 2 MHz (0x2)
mww 0x40010C04 [expr {($crh & 0xFF0000FF) | 0x00228800}]
# Pull-down fuer PB10/PB11 (ODR-Bits = 0)
mww 0x40010C10 [expr {(1<<26) | (1<<27)}]

proc probe {sda scl} {
    set bsrr 0
    if {$sda} { set bsrr [expr {$bsrr | (1<<12)}] } else { set bsrr [expr {$bsrr | (1<<28)}] }
    if {$scl} { set bsrr [expr {$bsrr | (1<<13)}] } else { set bsrr [expr {$bsrr | (1<<29)}] }
    mww 0x40010C10 $bsrr
    sleep 20
    set idr [mrw 0x40010C08]
    set pb10 [expr {($idr >> 10) & 1}]
    set pb11 [expr {($idr >> 11) & 1}]
    echo "Pad SDA(PB12)=$sda  Pad SCL(PB13)=$scl   ->  PB10=$pb10  PB11=$pb11"
}
probe 1 0
probe 0 1
probe 0 0
probe 1 1
reset run
exit
