# T12 Lötstation – Lötspitzen-Profile
# Eine Zeile pro Spitze:  - Name, Temperatur 1, Temperatur 2, Temperatur 3   (°C)
#   Temperatur 1   = wird beim Auswählen als Solltemperatur gesetzt
#   Temperatur 1-3 = liegen dann auf den drei Festwert-Tasten der Hauptseite
# Die Station lädt die Datei beim Start, alle 10 Minuten und im Menü
# "Festwerte -> Profile neu laden". Zeilen mit # werden ignoriert. Max. 20 Spitzen,
# Namen max. 16 Zeichen, Temperaturen 150-450 °C.

# --- Testwerte (gut erkennbar) ---
- TEST 1, 250, 260, 270
- TEST 2, 300, 310, 320

# --- Beispiele ---
- BC2, 330, 300, 360
- K, 350, 320, 380
- D24, 340, 310, 370
- ILS, 300, 280, 330
- BL, 320, 290, 350
